packages:
  - "apps/*"
  - "packages/*"
  - "infra/*"
  - "data/*"
allowBuilds:
  '@bubltec/mycota-cdk': true
  '@bubltec/mycota-config': true
  '@nestjs/core': true
  '@scarf/scarf': false
  esbuild: true
  lefthook: true
# First-party packages published by our own CI (vs. third-party supply-chain
# risk, which is what minimumReleaseAge exists to guard against) — exempt
# the whole scope so the `next` rolling-prerelease channel isn't silently
# blocked from ever installing what CI just published.
minimumReleaseAgeExclude:
  - '@bubltec/*'
